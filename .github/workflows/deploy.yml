name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build & Push dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 🔨 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🚀 Push built files to dist branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the existing dist branch so each deploy commit stays on top of
          # the previous one (linear history => Hostinger's `git pull` fast-forwards
          # instead of hitting "divergent branches").
          rm -rf "$RUNNER_TEMP/deploy"
          git clone --depth 50 --single-branch --branch dist \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "$RUNNER_TEMP/deploy" \
            || git init -b dist "$RUNNER_TEMP/deploy"

          cd "$RUNNER_TEMP/deploy"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Replace tracked files with the fresh build output
          git rm -rf --ignore-unmatch -q .
          cp -R "$GITHUB_WORKSPACE/dist"/. .
          git add -A
          git commit -m "deploy $(date +'%Y-%m-%d %H:%M')"
          git push -f origin dist